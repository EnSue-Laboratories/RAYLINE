name: CI

on:
  pull_request:
  push:
    branches: [main, refactor/typescript]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Skip install scripts (no Electron binary download), then build only the
      # native module the terminal tests load under Node.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild node-pty
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test
      - name: Build renderer + main process
        run: pnpm run build
